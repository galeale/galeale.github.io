<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Publications · Alessandro Galeazzi</title>
<meta name="description" content="Papers and preprints by Alessandro Galeazzi, grouped by year and research theme.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
.head { padding-block: 40px 32px; display: flex; flex-direction: column; gap: 12px; }
.head p { margin: 0; color: var(--on-ink-2); max-width: 68ch; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 999px; min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.filters button[aria-pressed="true"] { border-color: var(--text); font-weight: 600; }
.filters .dot { width: 10px; height: 10px; border-radius: 50%; }
.year { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 0 24px; border-top: 1px solid var(--line); padding-top: 18px; }
.year h2 { font-family: var(--mono); font-size: 18px; font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; }
.year ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
.pub { display: flex; flex-direction: column; gap: 4px; }
.pub .t { font-size: 17px; font-weight: 600; line-height: 1.35; color: var(--text); text-decoration: none; }
.pub .t:hover { color: var(--link); }
.pub .a { font-size: 14px; color: var(--text-2); }
.pub .a b { color: var(--text); font-weight: 600; }
.pub .m { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--text-3); }
.pub .v { font-style: italic; color: var(--text-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.pre { font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--text-2); }
.list { display: flex; flex-direction: column; gap: 28px; }
@media (max-width: 600px) { .year { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header class="band">
  <nav class="nav" aria-label="Main">
    <div class="wrap">
      <a class="brand" href="./">Alessandro Galeazzi</a>
      <ul>
        <li><a href="./">Home</a></li>
        <li><a href="publications.html" aria-current="page">Publications</a></li>
        <li><a href="teaching.html">Teaching</a></li>
        <li><a href="engagement.html">Public engagement</a></li>
        <li><a href="cycling.html">Off the desk</a></li>
        <li><a href="./#contact">Contact</a></li>
      </ul>
    </div>
  </nav>
  <div class="wrap head">
    <p class="eyebrow">Publications</p>
    <h1>Papers and preprints</h1>
    <p id="summary">Citation counts from <a href="https://scholar.google.com/citations?user=DK0tXAIAAAAJ">Google Scholar</a>.</p>
  </div>
</header>
<main class="section">
  <div class="wrap">
    <div class="filters" id="filters" role="group" aria-label="Filter by research theme"></div>
    <div class="list" id="list"></div>
  </div>
</main>
<footer class="foot">
  <div class="wrap">
    <span>Department of Mathematics, University of Padova</span>
    <span>Generated from data/publications.bib</span>
  </div>
</footer>
<script>
(function () {
  var theme = null, P, T = {};
  function parseCSV(text) { var out = {}; text.split(/\r?\n/).slice(1).forEach(function (l) { var m = l.match(/^([^,]+),(\d*)/); if (m && m[2]) out[m[1]] = +m[2]; }); return out; }
  function render() {
    var box = document.getElementById('list'); box.textContent = '';
    var shown = P.filter(function (p) { return !theme || p.theme === theme; });
    var years = Array.from(new Set(shown.map(function (p) { return p.yr; }))).sort(function (a, b) { return b - a; });
    years.forEach(function (y) {
      var sec = document.createElement('section'); sec.className = 'year';
      var h = document.createElement('h2'); h.textContent = y; sec.appendChild(h);
      var ol = document.createElement('ol');
      shown.filter(function (p) { return p.yr === y; }).sort(function (a, b) { return (b.c || 0) - (a.c || 0); }).forEach(function (p) {
        var li = document.createElement('li'); li.className = 'pub';
        var t = document.createElement('a'); t.className = 't'; t.textContent = p.t;
        t.href = 'https://scholar.google.com/scholar?q=' + encodeURIComponent('"' + p.t + '"');
        var a = document.createElement('span'); a.className = 'a';
        p.au.forEach(function (n, i) {
          if (i) a.appendChild(document.createTextNode(', '));
          if (/Galeazzi$/.test(n) && n.indexOf('A.') === 0) { var b = document.createElement('b'); b.textContent = n; a.appendChild(b); } else a.appendChild(document.createTextNode(n));
        });
        if (p.etal) a.appendChild(document.createTextNode(', et al.'));
        var m = document.createElement('span'); m.className = 'm';
        var v = document.createElement('span'); v.className = 'v'; v.textContent = p.v; m.appendChild(v);
        if (p.pre) { var pr = document.createElement('span'); pr.className = 'pre'; pr.textContent = 'Preprint'; m.appendChild(pr); }
        var ch = document.createElement('span'); ch.className = 'chip'; var dot = document.createElement('i'); dot.style.background = T[p.theme].color; ch.appendChild(dot); ch.appendChild(document.createTextNode(T[p.theme].label)); m.appendChild(ch);
        if (p.c) { var c = document.createElement('span'); c.textContent = 'cited by ' + p.c.toLocaleString('en-US'); m.appendChild(c); }
        li.appendChild(t); li.appendChild(a); li.appendChild(m); ol.appendChild(li);
      });
      sec.appendChild(ol); box.appendChild(sec);
    });
    document.querySelectorAll('#filters button').forEach(function (b) { b.setAttribute('aria-pressed', String((b.dataset.theme || null) === theme)); });
  }
  Promise.all([
    fetch('data/papers.json').then(function (r) { return r.json(); }),
    fetch('data/citations.csv').then(function (r) { return r.ok ? r.text() : ''; })
  ]).then(function (res) {
    var D = res[0], C = parseCSV(res[1]); P = D.papers;
    // the theme colours are drawn for the dark graph; darker steps keep the dots legible on white
    var onLight = { polar: '#2563EB', mis: '#C2410C', algo: '#7C3AED', clim: '#15803D', mob: '#0E7490', cult: '#BE185D', other: '#64748B' };
    D.themes.forEach(function (t) { T[t.id] = { label: t.label, color: onLight[t.id] || t.color }; });
    P.forEach(function (p) { if (C[p.key]) p.c = C[p.key]; });
    var pre = P.filter(function (p) { return p.pre; }).length;
    document.getElementById('summary').insertBefore(document.createTextNode(P.length + ' papers, ' + pre + ' of them preprints. '), document.getElementById('summary').firstChild);
    var f = document.getElementById('filters');
    function chip(label, color, id) {
      var b = document.createElement('button'); b.type = 'button'; if (id) b.dataset.theme = id;
      if (color) { var d = document.createElement('span'); d.className = 'dot'; d.style.background = color; b.appendChild(d); }
      b.appendChild(document.createTextNode(label));
      b.addEventListener('click', function () { theme = id && theme !== id ? id : null; render(); });
      f.appendChild(b);
    }
    chip('All', null, null);
    D.themes.forEach(function (t) { chip(T[t.id].label, T[t.id].color, t.id); });
    render();
  });
})();
</script>
</body>
</html>
